[project]
name = "callvanta-voice-backend"
version = "0.1.0"
description = "Callvanta conditional-forwarding voice gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
